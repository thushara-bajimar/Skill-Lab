<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic CalC</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="input">
        <input type="number" class="num1" placeholder="enter num1">
        <input type="number" class="num2" placeholder="enter num2">
    </div>
    <div class="op">
        <button class="add"> + (Add)</button>
        <button class="sub"> - (Subtract)</button>
        <button class="mul"> * (Multiply)</button>
        <button class="div"> / (Divide)</button>
    </div>
    <div class="result">
        <h1></h1>
    </div>

    <script src="script.js"></script>
</body>
</html>
